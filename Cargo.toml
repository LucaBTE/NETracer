[package]
name = "netracer"
version = "0.1.0-alpha.1"
edition = "2024"
description = "Terminal-based network monitoring and diagnostics."
license = "Apache-2.0"
repository = "https://github.com/LucaBTE/NETracer"
readme = "README.md"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0"
futures-util = "0.3"
hostname = "0.4.2"
netdev = "0.46.2"
ratatui = "0.30.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "sync"] }
tui-input = { version = "0.15.4", default-features = false, features = ["crossterm"] }